schema: superspec

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Every planning artifact goes through the review gate before anything reads it.
rules:
  brainstorm: ["After writing it, run the review gate in .agents/hooked-rules/repo-superspec-review-gate.md."]
  proposal: ["After writing it, run the review gate in .agents/hooked-rules/repo-superspec-review-gate.md."]
  design: ["After writing it, run the review gate in .agents/hooked-rules/repo-superspec-review-gate.md."]
  specs: ["After writing it, run the review gate in .agents/hooked-rules/repo-superspec-review-gate.md."]
  tasks: ["After writing it, run the review gate in .agents/hooked-rules/repo-superspec-review-gate.md."]
  plan: ["After writing it, run the review gate in .agents/hooked-rules/repo-superspec-review-gate.md."]

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - "Do not start until the review gate's apply stop in .agents/hooked-rules/repo-superspec-review-gate.md is satisfied."
      - "When every task is done, run verify and then finalize in the same turn without asking: finalize pushes the branch and creates or readies the PR, as .agents/hooked-rules/repo-superspec-closeout.md states."
  archive: { guidance: ["Archive runs once, in the closeout; see .agents/hooked-rules/repo-superspec-closeout.md."] }
