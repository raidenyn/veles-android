# Project-wide Gradle settings for the independent Rust build.
# Configuration cache is on and strict in all three builds (gradle-cache-safe, design D1); the
# daemon JVM arguments are shared with the repository-root gradle.properties.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
