[package]
name = "veles-crypto"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

# Test-only dependency of the OTP-02 shared-fixture consumer
# (tests/protocol_fixtures.rs), exact-pinned for the supply-chain policy.
[dev-dependencies]
serde_json = "=1.0.154"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
