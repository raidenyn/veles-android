# Standalone installer toolchain for the OTP-25 per-user installers.
# The channel/components/targets are also recorded in ../config/tools.lock.json
# (tool "rust"); keep both files in step. Task 2 owns the crate itself.

[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
