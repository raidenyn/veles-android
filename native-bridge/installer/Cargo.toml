[package]
name = "veles-bridge-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
autoexamples = false
description = "OTP-25 standalone per-user installer engine: strict package identity, inventory and policy carrier"

# Standalone workspace: the installer engine is deliberately not linked into the
# production host crate. Dependencies are the reviewed pins from the plan.
[workspace]

[lib]
name = "veles_bridge_installer"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"

# Windows-only OS trust evidence (Task 4) and host process inspection (Task 5).
# Exact pin and features reviewed as in the host crate; only the trust/
# cryptography, file-system, process, threading and process-list surface is
# enabled (`Wdk_System_SystemInformation` is `NtQuerySystemInformation`,
# `Win32_System_WindowsProgramming` is `SYSTEM_PROCESS_INFORMATION`).
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
