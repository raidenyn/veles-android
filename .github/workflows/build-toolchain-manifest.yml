name: build-toolchain-manifest

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
        default: SHA256SUMS.toolchains
      android-artifact-name:
        required: true
        type: string
        default: verified-android
      web-extension-artifact-name:
        required: true
        type: string
        default: verified-web-extension
      rust-artifact-name:
        required: true
        type: string
        default: rust-jni-wasm
      native-windows-artifact-name:
        required: true
        type: string
        default: verified-native-windows
      native-macos-artifact-name:
        required: true
        type: string
        default: verified-native-macos

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit-sha }}
      - name: Validate verified artifact names
        env:
          ANDROID_ARTIFACT_NAME: ${{ inputs.android-artifact-name }}
          WEB_EXTENSION_ARTIFACT_NAME: ${{ inputs.web-extension-artifact-name }}
          RUST_ARTIFACT_NAME: ${{ inputs.rust-artifact-name }}
          NATIVE_WINDOWS_ARTIFACT_NAME: ${{ inputs.native-windows-artifact-name }}
          NATIVE_MACOS_ARTIFACT_NAME: ${{ inputs.native-macos-artifact-name }}
        run: verify/validate-verified-artifact-names.sh "$ANDROID_ARTIFACT_NAME" "$WEB_EXTENSION_ARTIFACT_NAME" "$RUST_ARTIFACT_NAME" "$NATIVE_WINDOWS_ARTIFACT_NAME" "$NATIVE_MACOS_ARTIFACT_NAME"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.android-artifact-name }}
          path: build/verification/android
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.web-extension-artifact-name }}
          path: build/web-extension
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.rust-artifact-name }}
          path: build/rust-package
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native-windows-artifact-name }}
          path: build/verification/native-bridge/windows
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native-macos-artifact-name }}
          path: build/verification/native-bridge/macos
      - name: Validate and aggregate component manifests
        run: verify/aggregate-checksums.sh "${{ inputs.commit-sha }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/verification/SHA256SUMS.toolchains
          if-no-files-found: error
          retention-days: 14
