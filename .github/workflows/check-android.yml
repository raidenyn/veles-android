name: check-android

# Android node of the CI component tree (ci.yml -> `android / <job>`): static checks, JVM unit tests,
# the release-hook guard and the emulator suite. Checks only: the release-hook guard assembles the
# unsigned release APK in order to scan its DEX, manifest and resources for debug hooks, but nothing
# here signs, packages or uploads a release artifact (label-driven PR builds and master builds own
# that, see docs/ci.md).

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      # The restored `gradle-dependencies` cache can carry a stale/negative ktlint entry that
      # Spotless reports as "You need to add a repository containing the
      # '[com.pinterest.ktlint:ktlint-cli:…]' artifact". A clean modules cache resolves it from
      # Maven Central (verified with an empty GRADLE_USER_HOME), so reset only the dependency cache.
      - name: Reset the dependency cache Spotless resolves ktlint from
        run: rm -rf "$GRADLE_USER_HOME/caches/modules-2"
      - run: ./gradlew spotlessCheck
        working-directory: android
      - run: ./gradlew detekt
        working-directory: android
      - name: Guard against direct MAC comparisons outside the constant-time helpers
        run: node scripts/check-mac-comparisons.mjs --scan android/app/src/main
      - name: Guard against raw android.util.Log usage outside LogSink.kt
        run: android/scripts/check-raw-log.sh
      - name: Guard against pairing-code logging in the Kotlin debug surface
        run: android/scripts/check-pairing-code.sh
      - run: ./gradlew lintDebug
        working-directory: android

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      # testDebugUnitTest depends on the included Rust host-JVM cdylib (:rustHostJni), so the
      # Android-root invocation builds it without a separate root-only prebuild.
      - run: ./gradlew testDebugUnitTest
        working-directory: android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unit-test-results
          path: android/app/build/test-results/
          if-no-files-found: ignore

  release-hook-guard:
    name: release-hook-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        working-directory: android
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      - run: ./gradlew :app:releaseHookGuard
        working-directory: android

  instrumented-tests:
    name: instrumented-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        working-directory: android
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: instrumented-test-results
          path: android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
