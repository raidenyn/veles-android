name: check-android

# Android node of the CI component tree (ci.yml -> `android / <job>`): static checks, JVM unit tests,
# the release-hook guard and the emulator suite. Checks only: the release-hook guard assembles the
# unsigned release APK in order to scan its DEX, manifest and resources for debug hooks, but nothing
# here signs, packages or uploads a release artifact (label-driven PR builds and master builds own
# that, see docs/ci.md).

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - run: ./gradlew spotlessCheck
        working-directory: android
      - run: ./gradlew detekt
        working-directory: android
      - name: Guard against direct MAC comparisons outside the constant-time helpers
        run: node scripts/check-mac-comparisons.mjs --scan android/app/src/main
      - name: Guard against raw android.util.Log usage outside LogSink.kt
        run: |
          fail=0
          # Catch fully-qualified references and wildcard imports of android.util.Log
          if grep -rn "android.util.Log\|import android.util\.\*" android/app/src/main android/app/src/debug --include=*.kt | grep -v "LogSink.kt"; then
            echo "::error::Raw android.util.Log usage or wildcard import found outside LogSink.kt. Use VelesLog instead."
            fail=1
          fi
          # Catch bare Log.d/w/e/i/v calls (reachable via wildcard import) outside LogSink.kt
          if grep -rnE "Log\.[dweiv]\(" android/app/src/main android/app/src/debug --include=*.kt | grep -v "LogSink.kt"; then
            echo "::error::Bare Log.d/w/e/i/v call found outside LogSink.kt. Use VelesLog instead."
            fail=1
          fi
          exit $fail
      - name: Guard against pairing-code logging in the Kotlin debug surface
        run: |
          fail=0
          # The pairing code may exist only as the on-screen readout and the in-process
          # StateFlow. These greps mirror the Vitest negative controls: a sink combined
          # with a code-bearing value is a leak even when the line never names PairingCode.
          # The Chrome debug surface is guarded by web-extension / lint.
          if grep -rnE "(VelesLog|logger\.[dweiv]|\blogger?\b|Log\.[dweiv]|println|print\s*\(|setResultData|\bresult\s*\(|Notification|putExtra)" android/app/src/debug --include=*.kt | grep -E "(PairingCode|\.code\b|codeBytes|\bdigits\b|PairingDebugState|\bcode\b)"; then
            echo "::error::A pairing-code value reaches a logger, broadcast result or notification in the Android debug surface."
            fail=1
          fi
          exit $fail
      - run: ./gradlew lintDebug
        working-directory: android

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      # testDebugUnitTest depends on the included Rust host-JVM cdylib (:rustHostJni), so the
      # Android-root invocation builds it without a separate root-only prebuild.
      - run: ./gradlew testDebugUnitTest
        working-directory: android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unit-test-results
          path: android/app/build/test-results/
          if-no-files-found: ignore

  release-hook-guard:
    name: release-hook-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        working-directory: android
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      - run: ./gradlew :app:releaseHookGuard
        working-directory: android

  instrumented-tests:
    name: instrumented-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        working-directory: android
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: instrumented-test-results
          path: android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
