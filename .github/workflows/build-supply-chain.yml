name: build-supply-chain

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
        default: verified-supply-chain

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.8.1'
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - run: npm ci --ignore-scripts --prefix verify
      - run: ./gradlew installCargoDeny
      - run: verify/verify-supply-chain.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            build/sbom/web-extension.cdx.json
            build/sbom/rust.cdx.json
            build/sbom/native-bridge.cdx.json
            build/verification/supply-chain/npm-licenses.txt
            build/verification/supply-chain/cargo-licenses.txt
            build/verification/supply-chain/npm-install-scripts.txt
            build/verification/supply-chain/cargo-build-scripts.txt
            build/verification/supply-chain/remote-code.txt
          if-no-files-found: error
          retention-days: 14
