name: check-protocol

# Protocol node of the CI component tree (ci.yml -> `protocol / contract-tests`): the OTP-02 contract
# (fresh Node crypto evidence plus the Kotlin, Rust and both TypeScript consumers).

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            protocol/package-lock.json
            web-extension/package-lock.json
            native-bridge/package-lock.json
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      # protocolCheck runs the loopback child JVM, which loads the real host-JVM
      # Rust core from this test-only cdylib.
      - run: ./gradlew rustHostJni
      - name: Assert system Python version
        run: python3 --version && python3 -c 'import sys; assert sys.version_info >= (3, 8), sys.version'
      - run: ./gradlew protocolCheck
