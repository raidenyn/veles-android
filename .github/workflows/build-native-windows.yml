name: build-native-windows

# OTP-25 Task 14: the Windows producer of the standalone installer's UNSIGNED input tree.
#
# This is no longer the Tauri scaffold packaging: there is no Node, npm, Tauri, WiX or bridgePackage here.
# One job builds the tree through the installer Gradle graph, which itself builds it TWICE (slots a and b,
# separate target directories, source paths remapped, deterministic link settings) and refuses to publish
# unless the two trees are byte-identical under Task 9's inventory comparison. The product is a
# mode-preserving tree.tar plus provenance.json, report-ab.json and SHA256SUMS; uploads name exact files
# because artifact upload drops bare executable bits.
#
# Channel selection is explicit and fail-closed:
# - An approved, tracked native-bridge/installer/config/release-windows.json exists: the PRODUCTION
#   channel is built by bridgeInstallerUnsigned and published under the caller-selected name
#   (native-unsigned-windows). That is the artifact release-native-installers.yml (Task 13) downloads.
# - Otherwise only the tracked FIXTURE config is built by bridgeInstallerPackageFixture and published as
#   native-fixture-windows, which can never be mistaken for, or substituted as, the production input.
# Nothing here signs, notarizes or publishes; no secret, protected environment or artifact from another
# run is used.
# The Windows engine's policy carrier is embedded and the NSIS uninstaller generated on this runner;
# neither step has run anywhere yet (see the Task 14 report).

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
        default: native-unsigned-windows

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Provision the pinned NSIS (hash-verified)
        run: |
          pwsh -NoProfile -File native-bridge/installer/scripts/provision-nsis.ps1 -Destination ([IO.Path]::GetFullPath('build/native-bridge/installer/tools/nsis'))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Activate pinned Rust toolchain (installer)
        working-directory: native-bridge/installer
        run: rustup show active-toolchain
      - name: Activate pinned Rust toolchain (host)
        working-directory: native-bridge/host
        run: rustup show active-toolchain
      - name: Probe for the approved release config
        id: config
        shell: bash
        run: |
          if [ -f native-bridge/installer/config/release-windows.json ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi
      # The tool observation requires cl/link on PATH and VCToolsVersion,
      # WindowsSDKVersion and UCRTVersion in the environment. Enter the selected
      # Visual Studio developer shell and export every changed variable to the
      # following steps, so the observation and the Cargo build see the same
      # native toolchain context instead of relying on Rust's own MSVC discovery.
      - name: Enter the Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe is missing from the windows-2025 image' }
          $install = (& $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath -all | Select-Object -First 1)
          if (-not $install) { throw 'no Visual Studio installation with the MSVC x64 tools was found' }
          $devShell = Join-Path $install 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          if (-not (Test-Path $devShell)) { throw 'Microsoft.VisualStudio.DevShell.dll is missing from the selected installation' }
          Import-Module $devShell
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments '-arch=x64' | Out-Null
          Get-ChildItem Env: |
            Where-Object { $before[$_.Name] -ne $_.Value } |
            ForEach-Object { "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          foreach ($name in 'VCToolsVersion', 'WindowsSDKVersion', 'UCRTVersion') {
            if (-not (Get-Item -Path "Env:$name" -ErrorAction SilentlyContinue)) {
              throw "the developer environment did not export $name"
            }
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue) -or -not (Get-Command link.exe -ErrorAction SilentlyContinue)) {
            throw 'the developer environment did not put cl.exe and link.exe on PATH'
          }
      # The engine's release carrier is not supplied here: it does not exist until this job's own
      # assembler has run. The Gradle graph assembles the payload, verifies the carrier against the
      # exact descriptor and the registered channel, and only then rebuilds the engine with
      # VELES_EMBEDDED_CARRIER (fail-closed for the production channel). Supplying the variable in
      # this workflow would point the build at a file nobody assembled from this commit.
      - name: Build the production-channel unsigned input tree
        if: steps.config.outputs.approved == 'true'
        run: .\gradlew.bat bridgeInstallerUnsigned
      - name: Build the fixture-channel input tree
        if: steps.config.outputs.approved != 'true'
        run: .\gradlew.bat bridgeInstallerPackageFixture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.config.outputs.approved == 'true'
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            build/native-bridge/installer/out/production/tree.tar
            build/native-bridge/installer/out/production/provenance.json
            build/native-bridge/installer/out/production/report-ab.json
            build/native-bridge/installer/out/production/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.config.outputs.approved != 'true'
        with:
          name: native-fixture-windows
          path: |
            build/native-bridge/installer/out/fixture/tree.tar
            build/native-bridge/installer/out/fixture/provenance.json
            build/native-bridge/installer/out/fixture/report-ab.json
            build/native-bridge/installer/out/fixture/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
