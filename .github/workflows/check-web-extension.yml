name: check-web-extension

# Web extension node of the CI component tree (ci.yml -> `web-extension / <job>`): format, lint and type
# checks, the vitest source and bundle suites, and the Playwright browser check. Checks only: the extension
# zip is produced by label-driven PR builds and master builds (release-build.yml), never by CI.

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string

permissions:
  contents: read

# Pinned, not ubuntu-latest: the browser check installs the Playwright Chromium build, and the pinned
# Playwright rejects Ubuntu 26.04 ("Playwright does not support chromium on ubuntu26.04-x64"). Move these
# jobs to ubuntu-latest only after the Playwright version supports that image.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-extension/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      # The extension imports the generated WASM package (typecheck included).
      - run: ./gradlew rustWasm
      - run: npm ci --ignore-scripts
        working-directory: web-extension
      - run: npm run format:check
        working-directory: web-extension
      - run: npm run lint
        working-directory: web-extension
      - name: Guard against direct MAC comparisons outside the constant-time helpers
        run: node scripts/check-mac-comparisons.mjs --scan web-extension/src
      - name: Guard against pairing-code logging in the Chrome debug surface
        run: |
          if grep -rnE "(console\.[a-z]+|DiagnosticRing|diagnostics\.push|textContent\s*=|\bresult\s*\(|\blog\s*\()[^;]*(PairingCode|\.code\b|codeBytes|\bdigits\b|PairingDebugState|\bcode\b)" web-extension/src/debug --include=*.ts; then
            echo "::error::The pairing code reaches a log, DiagnosticRing or rendered text in the Chrome debug surface."
            exit 1
          fi
      - run: npm run typecheck
        working-directory: web-extension

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-extension/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      # The source and bundle tests import the generated WASM package.
      - run: ./gradlew rustWasm
      - run: npm ci --ignore-scripts
        working-directory: web-extension
      - run: npm test
        working-directory: web-extension
      - run: npm run build && npm run test:bundle
        working-directory: web-extension

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-extension/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      # The browser check loads the built dist/ (scripts/test-browser.mjs), which
      # bundles the WASM core.
      - run: ./gradlew rustWasm
      - run: npm ci --ignore-scripts
        working-directory: web-extension
      - run: npm run build
        working-directory: web-extension
      - run: npx playwright-core install --with-deps chromium
        working-directory: web-extension
      - run: npm run test:browser
        working-directory: web-extension
