name: release-build

# Thin caller graph composing the verified reusable workflows from Tasks 10-11.
# - Ordinary push to master runs only build-android.yml (preserves the existing
#   release-build cost profile).
# - A pull request carrying the `release-build` label runs the complete
#   component graph (Android, web, Rust, supply-chain, both native platforms,
#   and the toolchain aggregate).
# - A manual workflow_dispatch has an initial guard requiring
#   github.ref == 'refs/heads/master'; a dispatch from any selectable non-master
#   ref fails before any build or publication. A valid master dispatch runs the
#   complete graph and then publishes a prerelease from verified Android output,
#   preserving the existing prerelease collision/replacement behavior.

on:
  push:
    branches: [master]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: guard master-only dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fail non-master dispatch before any build
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Manual release-build dispatch must run from refs/heads/master; got $GITHUB_REF. Non-master dispatch is rejected before any build or publication."
          exit 1

  android:
    # Android runs on ordinary master push (cost-preserving) and on the full
    # graph (labeled PR and master manual dispatch). The guard only runs on
    # workflow_dispatch; on push/PR the always() + guard-skip clause lets this
    # job proceed without the guard dependency blocking it.
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'release-build') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-build'))
      ))) &&
      (github.event_name != 'workflow_dispatch' || needs.guard.result == 'success')
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-android.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: verified-android
      release-evidence-artifact-name: android-release-evidence
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  web-extension:
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'release-build') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-build'))
      ))) &&
      (github.event_name != 'workflow_dispatch' || needs.guard.result == 'success')
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-web-extension.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: verified-web-extension

  rust:
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'release-build') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-build'))
      ))) &&
      (github.event_name != 'workflow_dispatch' || needs.guard.result == 'success')
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-rust.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: rust-jni-wasm

  supply-chain:
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'release-build') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-build'))
      ))) &&
      (github.event_name != 'workflow_dispatch' || needs.guard.result == 'success')
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-supply-chain.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: verified-supply-chain

  native-windows:
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'release-build') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-build'))
      ))) &&
      (github.event_name != 'workflow_dispatch' || needs.guard.result == 'success')
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-native-windows.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: verified-native-windows

  native-macos:
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'release-build') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-build'))
      ))) &&
      (github.event_name != 'workflow_dispatch' || needs.guard.result == 'success')
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-native-macos.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: verified-native-macos

  aggregate:
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'release-build') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-build'))
      ))) &&
      (github.event_name != 'workflow_dispatch' || needs.guard.result == 'success')
    needs: [guard, android, web-extension, rust, supply-chain, native-windows, native-macos]
    permissions:
      contents: read
    uses: ./.github/workflows/build-toolchain-manifest.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: SHA256SUMS.toolchains
      android-artifact-name: verified-android
      web-extension-artifact-name: verified-web-extension
      rust-artifact-name: rust-jni-wasm
      native-windows-artifact-name: verified-native-windows
      native-macos-artifact-name: verified-native-macos

  publish:
    name: publish prerelease
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      needs.guard.result == 'success' &&
      needs.android.result == 'success' &&
      needs.supply-chain.result == 'success' &&
      needs.aggregate.result == 'success'
    needs: [guard, android, supply-chain, aggregate]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve derived release version
        id: version
        run: |
          VERSION=$(./gradlew -q :app:androidGitVersion | awk -F'\t' '/androidGitVersion.name/ {print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved derived version: $VERSION"
      - name: Download verified Android release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-release-evidence
          path: verified-android
      - name: Publish prerelease from verified Android output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            SUFFIX=""
            APK="verified-android/app-release.apk"
          else
            SUFFIX=" (unsigned)"
            APK="verified-android/app-release-unsigned.apk"
          fi

          # Preserve the existing prerelease collision/replacement behavior: a
          # previous manual prerelease for the same derived version is replaced,
          # but a real (non-prerelease) release is never overwritten.
          if EXISTING_JSON=$(gh release view "$VERSION" --json isPrerelease 2>/dev/null); then
            IS_PRERELEASE=$(echo "$EXISTING_JSON" | jq -r '.isPrerelease')
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "Replacing previous manual release for $VERSION"
              gh release delete "$VERSION" --cleanup-tag --yes
            else
              echo "::error::A real (non-prerelease) release already exists for version $VERSION. Refusing to overwrite it with a manual build. Push new commits before re-dispatching."
              exit 1
            fi
          fi

          gh release create "$VERSION" \
            "$APK" \
            "verified-android/mapping.txt" \
            --title "Veles $VERSION (manual build)$SUFFIX" \
            --prerelease \
            --generate-notes \
            --target "$GITHUB_SHA"