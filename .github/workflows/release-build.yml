name: release-build

# Component builds (design D8) and the release preview (design D5). Nothing here signs, tags or
# publishes: `publish-release.yml` alone does that.
# - Pull requests build by label only, re-evaluated on every opened/reopened/synchronize/labeled/
#   unlabeled event: `build-android` builds the unsigned release APK, `build-web-extension` the
#   extension zip. A PR without a build label builds nothing. The debug installers use
#   `build-windows-installer` / `build-macos-installer` in build-pr-installers.yml. `build-watch` is
#   reserved for the future watch component and builds nothing yet. The retired build labels from
#   before the component releases trigger nothing.
# - Master pushes build only the release components the push changed (`changes` runs
#   scripts/components.py over github.event.before..HEAD; an unusable base selects every component),
#   plus the Rust JNI/WASM package when `rust` changed. Installers are never built on master.
# - `preview` writes the release plan (current and next version per component, bump reasons, what
#   would be carried) to the job summary of every master push.
# Jobs shared by both events use `always() && (<PR label> || (<push> && <changed>))` so the push-only
# `changes` skip does not block PR builds.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# PR runs share one group per ref, so a superseded PR run is cancelled. Every master push gets its own
# group (per SHA), so no push run is cancelled or dropped while pending: each push only builds and
# previews its own before..after range.
concurrency:
  group: release-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.select.outputs.android }}
      web-extension: ${{ steps.select.outputs.web-extension }}
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # An unaccounted changed path selects every component and fails this job after the outputs are
      # written (ci.yml's `changes` reports the same failure); the selected builds still run.
      - name: Select changed components
        id: select
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo "base: ${BEFORE:-<none>}"
          status=0
          python3 -I scripts/components.py changed --base "$BEFORE" --github-output "$GITHUB_OUTPUT" || status=$?
          echo "changed-status=$status" >> "$GITHUB_OUTPUT"
      - name: Fail on unaccounted changed paths
        env:
          CHANGED_STATUS: ${{ steps.select.outputs.changed-status }}
        run: |
          if [ "$CHANGED_STATUS" != 0 ]; then
            echo "::error::changed paths are not owned, global or unowned in .github/components.json (every component was selected)"
            exit 1
          fi

  android:
    name: android
    needs: [changes]
    if: |
      always() && (
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-android')) ||
        (github.event_name == 'push' && needs.changes.outputs.android == 'true')
      )
    uses: ./.github/workflows/build-android.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: android-release

  web-extension:
    name: web-extension
    needs: [changes]
    if: |
      always() && (
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-web-extension')) ||
        (github.event_name == 'push' && needs.changes.outputs.web-extension == 'true')
      )
    uses: ./.github/workflows/build-web-extension.yml
    with:
      commit-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      artifact-name: web-extension

  rust:
    name: rust
    needs: [changes]
    if: always() && github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/build-rust.yml
    with:
      commit-sha: ${{ github.sha }}
      artifact-name: rust-jni-wasm

  # Bootstrap: with no combined release yet, `latest` prints nothing and the plan starts every
  # component at its initial version. A planner error (orphaned tags, a release without its
  # manifest) fails this job visibly.
  preview:
    name: preview
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Install the pinned git-cliff
        run: ./gradlew installGitCliff
      - name: Write the release plan to the job summary
        run: |
          gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt > releases.json
          TAG="$(python3 -I scripts/release_plan.py latest --releases-json releases.json)"
          if [ -n "$TAG" ] && gh release download "$TAG" --pattern release-manifest.json --output manifest.json; then
            echo "previous combined release: $TAG"
          else
            echo "previous combined release: ${TAG:-<none>} (no release-manifest.json)"
            echo '{}' > manifest.json
          fi
          python3 -I scripts/release_plan.py plan --releases-json releases.json --manifest-json manifest.json --out plan.json --summary "$GITHUB_STEP_SUMMARY"
