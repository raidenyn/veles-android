name: build-android

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
        default: verified-android
      release-evidence-artifact-name:
        required: true
        type: string
        default: android-release-evidence
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
      - run: ./gradlew assembleRelease
        if: env.KEYSTORE_BASE64 != ''
        env:
          VELES_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          VELES_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          VELES_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          VELES_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
      - run: ./gradlew assembleRelease
        if: env.KEYSTORE_BASE64 == ''
      - name: Build canonical unsigned release
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease
      - name: Verify APK and JNI allow-list
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          rust/scripts/verify-apk-jni.sh "$APK"
          verify/verify.sh "$APK" "${{ inputs.commit-sha }}"
      - name: Export canonical unsigned APK
        run: |
          mkdir -p build/verification/android
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/verification/android/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release-evidence-artifact-name }}
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/verification/android/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
