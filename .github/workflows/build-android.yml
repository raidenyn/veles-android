name: build-android

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
        default: verified-android
      release-evidence-artifact-name:
        required: true
        type: string
        default: android-release-evidence
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
      - run: ./gradlew assembleRelease
        if: env.KEYSTORE_BASE64 != ''
        env:
          VELES_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          VELES_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          VELES_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          VELES_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
      - name: Stage signed release evidence
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p build/verification/android-release-evidence
          cp app/build/outputs/apk/release/app-release.apk build/verification/android-release-evidence/app-release.apk
          cp app/build/outputs/mapping/release/mapping.txt build/verification/android-release-evidence/mapping.txt
      - run: ./gradlew assembleRelease
        if: env.KEYSTORE_BASE64 == ''
      - name: Stage unsigned release evidence
        if: env.KEYSTORE_BASE64 == ''
        run: |
          mkdir -p build/verification/android-release-evidence
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/verification/android-release-evidence/app-release-unsigned.apk
          cp app/build/outputs/mapping/release/mapping.txt build/verification/android-release-evidence/mapping.txt
      - name: Build canonical unsigned release
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease
      - name: Verify APK and JNI allow-list
        # The JNI allow-list runs against the canonical UNSIGNED APK (the
        # aggregate artifact). The Docker byte-compare (verify.sh) runs against
        # the SIGNED release APK when signing material was present, so
        # apksigcopier can compare the signed release against the signature-
        # stripped Docker rebuild (the "signed-versus-signature-stripped"
        # check). When no signing material is present the canonical unsigned
        # APK is the only release output and verify.sh byte-compares two
        # unsigned builds via its `cmp` fallback. Passing the unsigned canonical
        # to verify.sh on the signed path made apksigcopier fail with
        # "Missing META-INF/MANIFEST.MF" because an unsigned APK carries no
        # v2/v3 signing block manifest to strip.
        run: |
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          rust/scripts/verify-apk-jni.sh "$UNSIGNED"
          if [ -f "build/verification/android-release-evidence/app-release.apk" ]; then
            verify/verify.sh "build/verification/android-release-evidence/app-release.apk" "${{ inputs.commit-sha }}"
          else
            verify/verify.sh "$UNSIGNED" "${{ inputs.commit-sha }}"
          fi
      - name: Export canonical unsigned APK
        run: |
          mkdir -p build/verification/android
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/verification/android/app-release-unsigned.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.release-evidence-artifact-name }}
          path: build/verification/android-release-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/verification/android/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
