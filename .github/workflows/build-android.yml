name: build-android

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
        default: android-release
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
      # One mutually exclusive assembly path: exactly one of the two steps
      # below runs per invocation, selected by signing-material presence. The
      # signed path builds the signed app-release.apk; the unsigned path
      # builds app-release-unsigned.apk. No second, canonical unsigned
      # reference build is performed.
      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease
        env:
          VELES_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          VELES_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          VELES_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          VELES_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
      - name: Build unsigned release APK
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew assembleRelease
      # The JNI allow-list runs against the APK that was actually assembled,
      # not against a separately built canonical artifact.
      - name: Verify APK JNI allow-list
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          test -f "$APK"
          rust/scripts/verify-apk-jni.sh "$APK"
      # Stage the actual release APK (under its selected name), the R8
      # mapping, and a SHA256SUMS manifest over both, and upload them as one
      # directory artifact. sha256sum emits the records APK-first, which is
      # already the byte-sorted order of the staged file names.
      - name: Stage release APK, mapping, and checksums
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            APK="app-release.apk"
          else
            APK="app-release-unsigned.apk"
          fi
          test -f "app/build/outputs/apk/release/$APK"
          mkdir -p build/verification/android-release
          cp "app/build/outputs/apk/release/$APK" "build/verification/android-release/$APK"
          cp app/build/outputs/mapping/release/mapping.txt build/verification/android-release/mapping.txt
          (
            cd build/verification/android-release
            sha256sum "$APK" mapping.txt > SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/verification/android-release/
          if-no-files-found: error
          retention-days: 14
