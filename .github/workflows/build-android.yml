name: build-android

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
        default: android-release
      version-tag:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      # Optional local-only tag so the derived version matches a planned
      # release. The tag is never pushed.
      - name: Create local version tag
        if: inputs.version-tag != ''
        env:
          VERSION_TAG: ${{ inputs.version-tag }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          git tag "$VERSION_TAG" "$COMMIT"
      - name: Build unsigned release APK
        run: ./gradlew assembleRelease
      - name: Assert derived version matches the version tag
        if: inputs.version-tag != ''
        env:
          VERSION_TAG: ${{ inputs.version-tag }}
        run: |
          EXPECTED="${VERSION_TAG#android-v}"
          ACTUAL="$(./gradlew -q :app:androidGitVersion | awk -F'\t' '/androidGitVersion.name/ {print $2}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::androidGitVersion name '$ACTUAL' does not match tag version '$EXPECTED'"
            exit 1
          fi
      - name: Verify APK JNI allow-list
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          rust/scripts/verify-apk-jni.sh "$APK"
      # Stage the actual release APK (unsigned), the R8
      # mapping, and a SHA256SUMS manifest over both, and upload them as one
      # directory artifact. sha256sum emits the records APK-first, which is
      # already the byte-sorted order of the staged file names.
      - name: Stage release APK, mapping, and checksums
        run: |
          APK="app-release-unsigned.apk"
          test -f "app/build/outputs/apk/release/$APK"
          mkdir -p build/verification/android-release
          cp "app/build/outputs/apk/release/$APK" "build/verification/android-release/$APK"
          cp app/build/outputs/mapping/release/mapping.txt build/verification/android-release/mapping.txt
          (
            cd build/verification/android-release
            sha256sum "$APK" mapping.txt > SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/verification/android-release/
          if-no-files-found: error
          retention-days: 14
