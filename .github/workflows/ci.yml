name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    name: lint-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - run: ./gradlew spotlessCheck
      - run: ./gradlew detekt
      - name: Guard against raw android.util.Log usage outside LogSink.kt
        run: |
          fail=0
          # Catch fully-qualified references and wildcard imports of android.util.Log
          if grep -rn "android.util.Log\|import android.util\.\*" app/src/main --include=*.kt | grep -v "LogSink.kt"; then
            echo "::error::Raw android.util.Log usage or wildcard import found outside LogSink.kt. Use VelesLog instead."
            fail=1
          fi
          # Catch bare Log.d/w/e/i/v calls (reachable via wildcard import) outside LogSink.kt
          if grep -rnE "Log\.[dweiv]\(" app/src/main --include=*.kt | grep -v "LogSink.kt"; then
            echo "::error::Bare Log.d/w/e/i/v call found outside LogSink.kt. Use VelesLog instead."
            fail=1
          fi
          exit $fail
      - run: ./gradlew lintDebug

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - run: ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/
          if-no-files-found: ignore

  instrumented-tests:
    name: instrumented-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  web-extension:
    name: web-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-extension/package-lock.json
      - run: npm ci
        working-directory: web-extension
      - run: npm run format:check
        working-directory: web-extension
      - run: npm run lint
        working-directory: web-extension
      - run: npm run typecheck
        working-directory: web-extension
      - run: npm test
        working-directory: web-extension
      - run: npm run build && npm run test:bundle
        working-directory: web-extension
      - run: npm run package
        working-directory: web-extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: veles-extension-zip
          path: build/web-extension/
          if-no-files-found: error

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-extension/package-lock.json
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Activate pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Install pinned Android NDK
        run: |
          NDK_VERSION="$(./gradlew -q rustNdkVersion)"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/toolchain-tools.toml', 'rust/Cargo.lock') }}
      - run: ./gradlew rustFormat rustLint rustTest :app:assembleDebug
      - run: rust/scripts/verify-apk-jni.sh app/build/outputs/apk/debug/app-debug.apk
      - run: npm ci && npm run build
        working-directory: web-extension
      - run: ./gradlew clean
      - run: rust/scripts/assert-clean.sh
      - run: ./gradlew :app:assembleDebug
      - run: rust/scripts/verify-apk-jni.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Refill complete Rust tool cache
        run: ./gradlew rustInstall
