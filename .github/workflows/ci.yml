name: CI

# Component-tree CI (docs/ci.md). `changes` checks the component map (.github/components.json) and selects
# the affected nodes; each node calls its reusable check workflow, reported as `<node> / <check>`. Only
# `ci-ok` (here) and `pr-title` (pr-title.yml) are required checks.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# PR runs share one group per ref, so a superseded PR run is cancelled. Every master push gets its own group
# (per SHA): GitHub keeps only one pending run per group and drops the older pending one, so a shared push
# group would lose a queued push's run. Each push therefore keeps its commit-guard run (the next push only
# validates its own before..after range).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PR base: the merge base with the base branch; push base: github.event.before. A missing or all-zero
  # base, a global path or an unaccounted path selects every node. An unaccounted changed path, or a map
  # that fails the check, still writes the node outputs first and then fails this job, so the selected
  # nodes run and ci-ok fails.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      android: ${{ steps.select.outputs.android }}
      web-extension: ${{ steps.select.outputs.web-extension }}
      installer: ${{ steps.select.outputs.installer }}
      rust: ${{ steps.select.outputs.rust }}
      protocol: ${{ steps.select.outputs.protocol }}
      native-host: ${{ steps.select.outputs.native-host }}
      bridge-scaffold: ${{ steps.select.outputs.bridge-scaffold }}
      supply-chain: ${{ steps.select.outputs.supply-chain }}
      tooling: ${{ steps.select.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select affected nodes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_LAST_GREEN: ${{ vars.CI_LAST_GREEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE="$(git merge-base "origin/$BASE_REF" HEAD)" || BASE=""
          else
            BASE="$BEFORE"
          fi
          echo "base: ${BASE:-<none>}"
          status=0
          mode=all
          if [ "$EVENT_NAME" = pull_request ]; then
            mode=last-green
            if ! python3 -I scripts/last_green.py --pr "$PR_NUMBER" --head "$PR_HEAD_SHA" --head-repo "$PR_HEAD_REPO" --head-ref "$PR_HEAD_REF" --out bases.json --notes-out notes.json; then
              mode=fallback
              echo "::warning::last-green evidence unavailable; selecting every node"
            fi
          fi
          if [ "$mode" = last-green ]; then
            python3 -I scripts/components.py changed --base "$BASE" --head HEAD --node-head "$PR_HEAD_SHA" --node-bases bases.json --evidence-notes notes.json --summary-out summary.md --github-output "$GITHUB_OUTPUT" || status=$?
          else
            python3 -I scripts/components.py changed --base "$BASE" --head HEAD --all --summary-out summary.md --github-output "$GITHUB_OUTPUT" || status=$?
          fi
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "changed-status=$status" >> "$GITHUB_OUTPUT"
      - name: Check the component map
        run: python3 -I scripts/components.py check
      - name: Fail on unaccounted changed paths
        env:
          CHANGED_STATUS: ${{ steps.select.outputs.changed-status }}
        run: |
          if [ "$CHANGED_STATUS" != 0 ]; then
            echo "::error::changed paths are not owned, global or unowned in .github/components.json (every node was selected)"
            exit 1
          fi

  android:
    name: android
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.android == 'true' }}
    uses: ./.github/workflows/check-android.yml
    with:
      commit-sha: ${{ github.sha }}

  web-extension:
    name: web-extension
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web-extension == 'true' }}
    uses: ./.github/workflows/check-web-extension.yml
    with:
      commit-sha: ${{ github.sha }}

  installer:
    name: installer
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.installer == 'true' }}
    uses: ./.github/workflows/check-installer.yml
    with:
      commit-sha: ${{ github.sha }}

  rust:
    name: rust
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/check-rust.yml
    with:
      commit-sha: ${{ github.sha }}

  protocol:
    name: protocol
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.protocol == 'true' }}
    uses: ./.github/workflows/check-protocol.yml
    with:
      commit-sha: ${{ github.sha }}

  native-host:
    name: native-host
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.native-host == 'true' }}
    uses: ./.github/workflows/check-native-host.yml
    with:
      commit-sha: ${{ github.sha }}

  bridge-scaffold:
    name: bridge-scaffold
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.bridge-scaffold == 'true' }}
    uses: ./.github/workflows/check-bridge-scaffold.yml
    with:
      commit-sha: ${{ github.sha }}

  supply-chain:
    name: supply-chain
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.supply-chain == 'true' }}
    uses: ./.github/workflows/build-supply-chain.yml
    with:
      commit-sha: ${{ github.sha }}
      artifact-name: supply-chain-reports

  tooling:
    name: tooling
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.tooling == 'true' }}
    uses: ./.github/workflows/check-tooling.yml
    with:
      commit-sha: ${{ github.sha }}

  # Post-merge backstop for the PR title check: every commit pushed to master must be a Conventional
  # Commit. A new-branch push (all-zero before) or an unknown before validates only the pushed head.
  commit-guard:
    name: commit-guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commits="$(git rev-list "$BEFORE..$AFTER")"
          else
            commits="$(git rev-list -n 1 "$AFTER")"
          fi
          fail=0
          for sha in $commits; do
            message="$(git log -1 --format=%B "$sha")"
            if ! python3 -I scripts/commitlint.py --message "$message"; then
              echo "::error::commit $sha is not a Conventional Commit: $(git log -1 --format=%s "$sha")"
              fail=1
            fi
          done
          exit $fail

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, android, web-extension, installer, rust, protocol, native-host, bridge-scaffold, supply-chain, tooling, commit-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected node to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::changes did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled)
                echo "::error::a required job finished with $result"
                exit 1
                ;;
            esac
          done
          echo "results: $RESULTS"
