name: OTP-23 feasibility harness

on:
  pull_request:
    branches: [master]
    paths: ['native-bridge/feasibility/**', '.github/workflows/otp23-feasibility.yml']
  push:
    branches: [master]
    paths: ['native-bridge/feasibility/**', '.github/workflows/otp23-feasibility.yml']

jobs:
  harness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native-bridge/feasibility
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --test scripts/connector-api.test.mjs
      - run: python scripts/verify-identity.py
        if: runner.os == 'Windows'
      - run: cargo build --locked --release --features tauri-runtime --bins
        if: runner.os == 'Windows'
