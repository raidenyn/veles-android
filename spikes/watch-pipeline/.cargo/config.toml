[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
# Pinned: esp-idf-template's default for esp-idf-svc 0.53.
ESP_IDF_VERSION = "v5.5.5"
# Share one ESP-IDF checkout/toolchain install across projects (~/.espressif).
ESP_IDF_TOOLS_INSTALL_DIR = "global"
