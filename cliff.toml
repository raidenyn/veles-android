# git-cliff configuration for component releases (scripts/release_plan.py).
#
# The planner runs the pinned git-cliff (scripts/release-tools.toml) once per release component
# with --include-path (the component's release paths from .github/components.json) and
# --tag-pattern '^<prefix>[0-9]+\.[0-9]+\.[0-9]+$'. `initial_tag` is deliberately absent: it is
# global here, so the planner handles untagged components itself (initial-version, <since>..HEAD).
#
# Bump policy: feat -> minor; fix/perf -> patch; `!` header or BREAKING CHANGE / BREAKING-CHANGE
# footer -> major (also below 1.0.0); every other type and non-conventional commits -> no bump.
# Parser order matters: the raw_message breaking parsers come first and the catch-all skip last.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { field = "raw_message", pattern = "^[a-z]+(\\([^)]*\\))?!:", group = "Breaking" },
  { field = "raw_message", pattern = "(?m)^BREAKING[ -]CHANGE:", group = "Breaking" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = ".*", skip = true },
]
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
