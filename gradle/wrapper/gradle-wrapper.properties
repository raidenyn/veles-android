distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
# Upstream-published SHA-256 of gradle-9.5.0-bin.zip. The wrapper verifies the
# downloaded distribution against this checksum before unpacking, so a
# compromised or drifted distribution is rejected at download time in every
# environment that runs ./gradlew for the first time (CI runners, the
# verification Docker images, developer machines).
distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
